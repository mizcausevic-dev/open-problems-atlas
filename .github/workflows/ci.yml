name: CI

# Runs the checks that were already required locally before every commit, so a
# pull request cannot merge with them failing. Deliberately does NOT deploy:
# deploys go over SSH from a workstation, because Hostinger's WAF blocks GitHub
# Actions IP ranges on SFTP, and because a deploy that fires on merge would have
# shipped the two production incidents in this repo's history without a human
# looking at the result.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: fails if package-lock.json and package.json disagree,
      # rather than silently resolving to something the lockfile never described.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The generated datasets are committed, so this must succeed with no
      # network access. If it ever needs the MediaWiki API to build, that is a
      # regression: a contributor cloning the repo would be unable to build it.
      - name: Build
        run: npm run build

      - name: Check the service worker was stamped
        run: |
          if grep -q '__SW_VERSION__' dist/sw.js; then
            echo "::error::sw.js still contains the version placeholder; inject-precache did not run"
            exit 1
          fi
          if ! grep -q "assets/" dist/sw.js; then
            echo "::error::sw.js has no precached assets; inject-precache did not run"
            exit 1
          fi
          grep -o "const VERSION = '[^']*'" dist/sw.js

  data-integrity:
    name: Dataset can be regenerated from source
    runs-on: ubuntu-latest
    # Touches the live MediaWiki API, so it runs on a schedule and on demand
    # rather than on every push. Its job is to notice when the source article has
    # drifted far enough from the committed snapshot to be worth regenerating.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Regenerate and report the diff
        run: |
          node scripts/build-dataset.mjs
          if git diff --quiet src/data/problems.generated.json; then
            echo "Dataset is unchanged against the live article."
          else
            echo "::notice::The source article has changed since the committed snapshot."
            git diff --stat src/data/problems.generated.json
          fi
